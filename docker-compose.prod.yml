services:
  app:
    build:
      context: ./backend
    image: yamaps-test-app:prod
    volumes:
      - backend-app-storage:/var/www/storage
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  queue-worker:
    build:
      context: ./backend
    image: yamaps-test-app:prod
    command: php artisan queue:work --queue=scraping,default --tries=3 --sleep=1
    volumes:
      - backend-queue-storage:/var/www/storage
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # Разовая сборка фронтенда: `docker compose -f docker-compose.prod.yml --profile build run --rm frontend-build`
  # Кладёт статику в ./frontend/dist, откуда её раздаёт nginx (см. volumes ниже).
  frontend-build:
    image: node:22-alpine
    profiles: ["build"]
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run build"

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www:ro
      - ./frontend/dist:/srv/frontend:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yamaps_reviews
      MYSQL_USER: yamaps
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  backend-app-storage:
  backend-queue-storage:

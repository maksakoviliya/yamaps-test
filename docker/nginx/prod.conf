server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Laravel API + Sanctum SPA-аутентификация (cookie/CSRF) — отдаётся тем же
    # доменом, что и фронтенд, чтобы не иметь дела с cross-site cookies.
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }

    # Собранная статика SPA (Vue Router в history-режиме — fallback на index.html).
    location / {
        root /srv/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

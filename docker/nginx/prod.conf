server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Laravel API + Sanctum SPA-аутентификация (cookie/CSRF) — отдаётся тем же
    # доменом, что и фронтенд, чтобы не иметь дела с cross-site cookies.
    #
    # try_files здесь fallback'ится на именованную location, а не напрямую на
    # /index.php?..., потому что внутренний redirect от try_files ищет
    # совпадение заново от server-контекста — вложенный location ~ \.php$
    # внутри этого блока при таком поиске не подхватывается.
    location ~ ^/(api|sanctum)(/|$) {
        root /var/www/public;
        try_files $uri $uri/ @backend;
    }

    location @backend {
        rewrite ^ /index.php last;
    }

    location = /index.php {
        root /var/www/public;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Собранная статика SPA (Vue Router в history-режиме — fallback на index.html).
    location / {
        root /srv/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
